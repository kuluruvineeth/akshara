[project]
name = "akshara"
version = "0.1.0"
description = "An open English + Telugu language model family: data, tokenizer, model, training and evaluation"
license = "Apache-2.0"
authors = [
    { name = "Kuluru Vineeth", email = "kuluruvineeth8623@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dataflow",
    "huggingface-hub>=1.33.0",
    "numpy>=2",
    "tokenizers>=0.23.2",
    "torch>=2.14.1",
]

[project.scripts]
akshara-tokenizer = "akshara.tokenizer.cli:main"
akshara-evals = "akshara.evals.freeze:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "transformers>=5.17",
]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
dataflow = { path = "../dataflow", editable = true }
